#          driverClassName: org.postgresql.Driver
#          url: ${datasource.system-postgres.url}
#          username: ${datasource.system-postgres.username}
#          password: ${datasource.system-postgres.password}

# warm-flow工作流配置
warm-flow:
  # 是否开启工作流，默认true
  enabled: true
  # 是否开启设计器ui
  ui: true
  # 是否显示流程图顶部文字
  top-text-show: true
  # 是否渲染节点悬浮提示，默认true
  node-tooltip: true
  # 默认Authorization，如果有多个token，用逗号分隔
  token-name: ${sa-token.token-name},clientid

# LiteFlow 业务规则编排
liteflow:
  # 跟随工作流模块开关，避免禁用工作流时仍加载任务办理链
  enable: ${warm-flow.enabled:true}
  metrics:
    # 临时修复：LiteFlow 2.16.2.1 的 Actuator 端点与 Spring Boot 4.1 参数名校验不兼容
    # 待 LiteFlow 修复该问题后恢复为 ${liteflow.enable:true}
    enabled: false
  # 工作流模块用于编排任务办理链路
  rule-source: classpath:liteflow/*.el.xml
  # 开启虚拟线程
  enable-virtual-thread: true
